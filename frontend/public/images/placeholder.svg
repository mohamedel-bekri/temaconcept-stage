<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Visuel TEMACONCEPT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3a57"/>
      <stop offset="0.55" stop-color="#06324c"/>
      <stop offset="1" stop-color="#02121f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4da9d9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4da9d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8fb4cc" opacity="0.16"/>
    </pattern>
    <path id="rosette" d="M0 -150 C10 -50 30 -10 140 0 C30 10 10 50 0 150 C-10 50 -30 10 -140 0 C-30 -10 -10 -50 0 -150 Z"/>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <g transform="translate(600 430) scale(4.4)" fill="none" stroke="#4da9d9" stroke-opacity="0.55" stroke-width="16">
    <use href="#rosette"/>
    <use href="#rosette" transform="rotate(45)"/>
  </g>

  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <text x="600" y="820" fill="#8fb4cc" font-size="24" letter-spacing="10">TEMACONCEPT</text>
    <text x="600" y="854" fill="#e8f4fa" font-size="15" letter-spacing="8" opacity="0.8">SYS — VISUEL À VENIR</text>
  </g>
</svg>
